# MCUboot (bootloader image) hardening.
#
# Sysbuild auto-applies this fragment to the `mcuboot` image of a
# `west build --sysbuild` build. It tunes the bootloader itself; the signature
# *type* and *key* are set one level up, in sysbuild.conf, because sysbuild has
# to hand the same choice to both MCUboot and the application signer.

# ---------------------------------------------------------------------------
# Verify the primary slot on EVERY boot
# ---------------------------------------------------------------------------
# This is what turns "OTA with an integrity check" into secure boot: the
# bootloader re-verifies slot0's signature against the embedded Root-of-Trust
# public key on every reset, not only right after an upgrade. A flash image
# tampered with in place (e.g. via a debugger or a glitch) fails the check and
# is not executed. Default is already y; pinned so the guarantee is explicit
# and survives an upstream default change.
CONFIG_BOOT_VALIDATE_SLOT0=y

# ---------------------------------------------------------------------------
# Anti-rollback (downgrade prevention)
# ---------------------------------------------------------------------------
# Reject an update whose security counter is lower than the running image's.
# Keying the policy off a dedicated security-counter TLV (see
# sysbuild/ble.conf) rather than the human-facing version number means routine
# version bumps never trip rollback protection — you raise the counter only for
# releases that close a vulnerability you must never roll back past. The
# security-counter variant works with swap mode, so revert-on-failed-confirm
# still works (a failed new image reverts to the previous, already-trusted one;
# it is not a downgrade because the previous image's counter is not lower).
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION_SECURITY_COUNTER=y
