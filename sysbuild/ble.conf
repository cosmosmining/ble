# OTA DFU over BLE for the `ble` application image.
#
# sysbuild auto-applies this fragment to the `ble` image; a plain
# `west build` (no --sysbuild) ignores the sysbuild/ directory entirely, so the
# standalone sensor build stays lean. CONFIG_BOOTLOADER_MCUBOOT is supplied by
# sysbuild when MCUboot is the bootloader.

# MCUmgr core + SMP-over-Bluetooth transport
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y

# Management groups: OS (echo/reset) and image (upload/list/confirm)
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_IMG=y

# Image-management storage backend
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# DFU throughput: larger ATT MTU + LE Data Length Extension
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
