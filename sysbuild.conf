# Sysbuild options — only consulted by `west build --sysbuild`. A plain
# `west build` ignores this file entirely, so the standalone sensor build is
# unaffected by everything below.

# Build MCUboot alongside the application and produce a signed image.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# ---------------------------------------------------------------------------
# Secure boot: Root of Trust
# ---------------------------------------------------------------------------
# Authenticate every image with ECDSA over NIST P-256. Versus the MCUboot
# default (RSA-2048) this gives much smaller signatures/keys (64 B sig, 32 B
# key) with no SoC crypto-accelerator dependency on the nRF52840 — a better fit
# for a flash- and power-constrained sensor node.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# Our own Root-of-Trust key. MCUboot embeds the *public* half and refuses to
# boot any image not signed by the matching private key; `west sign` uses the
# *private* half to sign the application image.
#
# Absolute path (via this repo's module dir) so the bootloader image and the
# application image resolve it identically — see zephyr/module.yml.
#
# DEV KEY ONLY. Production must override this with a key whose private half is
# held in an HSM and never committed. See keys/README.md and docs/secure-boot.md.
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="$(ZEPHYR_BLE_ENV_SENSOR_MODULE_DIR)/keys/dev-signing-ec-p256.pem"

# Swap-using-move (the nRF default) keeps the secondary slot's previous image,
# so MCUboot can still revert an update that fails to confirm. Pinned explicitly
# because the anti-rollback security counter (sysbuild/mcuboot.conf) depends on a
# swap mode, and so the test/confirm/revert contract is not silently lost if the
# upstream default ever changes.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
