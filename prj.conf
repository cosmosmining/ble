# ---------- Logging ----------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_THREAD_NAME=y

# ---------- Sensor + buses ----------
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_HTS221=y
# Data-ready trigger handled in the sensor subsystem's global trigger thread,
# woken by the DRDY GPIO ISR. Requires drdy-gpios in the devicetree overlay.
CONFIG_HTS221_TRIGGER_GLOBAL_THREAD=y

# ---------- Bluetooth peripheral ----------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ble-env-sensor"

# Power-tuned preferred connection parameters (advertised to the central)
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=80
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=120
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# ---------- Watchdog ----------
CONFIG_WATCHDOG=y
