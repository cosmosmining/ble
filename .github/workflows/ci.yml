name: build

on:
  push:
  pull_request:

jobs:
  build:
    name: build (${{ matrix.board }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board:
          - nrf52840dk/nrf52840
          - nrf52833dk/nrf52833
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ble

      - name: Set up Zephyr workspace + toolchain
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: ble
          toolchains: arm-zephyr-eabi

      - name: Build firmware
        run: west build -p always -b ${{ matrix.board }} ble

  build-ota:
    name: build OTA image (MCUboot)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ble

      - name: Set up Zephyr workspace + toolchain
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: ble
          toolchains: arm-zephyr-eabi

      - name: Build signed image via sysbuild
        # Signing is a build step: if the Root-of-Trust key can't be resolved,
        # this fails. A green build already proves key resolution + signing ran.
        run: west build -p always -b nrf52840dk/nrf52840 --sysbuild ble

      - name: Verify the signed image against our Root-of-Trust key
        # Cryptographically confirm the produced image validates under our public
        # key, using the same imgtool that signed it (no extra deps to install).
        run: |
          signed=$(find build -name 'zephyr.signed.bin' | head -n1)
          test -n "$signed" || { echo "no signed image produced"; exit 1; }
          echo "verifying $signed"
          python3 bootloader/mcuboot/scripts/imgtool.py verify \
            -k ble/keys/dev-signing-ec-p256.pem "$signed"

  twister:
    name: unit tests (native_sim)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ble

      - name: Set up Zephyr workspace + toolchain
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: ble
          toolchains: arm-zephyr-eabi

      - name: Host compiler multilib (native_sim is 32-bit)
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      - name: Run Twister
        run: west twister -T ble/tests -p native_sim -v --inline-logs
