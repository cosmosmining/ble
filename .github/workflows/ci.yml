name: build

on:
  push:
  pull_request:

jobs:
  build:
    name: build (${{ matrix.board }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board:
          - nrf52840dk/nrf52840
          - nrf52833dk/nrf52833
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ble

      - name: Set up Zephyr workspace + toolchain
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: ble
          toolchains: arm-zephyr-eabi

      - name: Build firmware
        run: west build -p always -b ${{ matrix.board }} ble

  build-ota:
    name: build OTA image (MCUboot)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ble

      - name: Set up Zephyr workspace + toolchain
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: ble
          toolchains: arm-zephyr-eabi

      - name: Build signed image via sysbuild
        # Signing is a build step: if the Root-of-Trust key can't be resolved,
        # this fails. A green build already proves key resolution + signing ran.
        run: west build -p always -b nrf52840dk/nrf52840 --sysbuild ble

      - name: Confirm the bootloader's Root of Trust is our key
        # Signing already fails the build above if our key can't be resolved, so a
        # signed image was produced with keys/dev-signing-ec-p256.pem. Here we
        # assert the other half of the chain: that MCUboot embeds OUR public key
        # as its Root of Trust, so only images signed by that key will boot. We
        # compare the generated key array against our key directly rather than run
        # `imgtool verify`, whose Python ECDSA path is unreliable (the on-device
        # TinyCrypt check is the authoritative one).
        run: |
          pub=$(find build/mcuboot -name autogen-pubkey.c | head -n1)
          test -n "$pub" || { echo "bootloader public-key file not found"; exit 1; }
          python3 - "$pub" ble/keys/dev-signing-ec-p256.pem <<'PY'
          import re, subprocess, sys
          embedded = bytes(int(b, 16) for b in re.findall(r'0x([0-9a-fA-F]{2})', open(sys.argv[1]).read()))
          der = subprocess.check_output(
              ["openssl", "ec", "-in", sys.argv[2], "-pubout", "-outform", "DER"],
              stderr=subprocess.DEVNULL)
          point = der[-64:]  # uncompressed EC public point (X||Y)
          if point not in embedded:
              sys.exit("Root of Trust MISMATCH: bootloader does not embed our public key")
          print("Root of Trust OK: bootloader embeds the keys/dev-signing-ec-p256.pem public key")
          PY

  twister:
    name: unit tests (native_sim)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ble

      - name: Set up Zephyr workspace + toolchain
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: ble
          toolchains: arm-zephyr-eabi

      - name: Host compiler multilib (native_sim is 32-bit)
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      - name: Run Twister
        run: west twister -T ble/tests -p native_sim -v --inline-logs
